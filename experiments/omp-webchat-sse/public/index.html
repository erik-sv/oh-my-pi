<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMP Webchat SSE</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --panel: #ffffff;
        --border: #dedee3;
        --text: #202123;
        --muted: #6b7280;
        --user: #2f6feb;
        --assistant: #ffffff;
        --assistant-border: #e5e7eb;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #ffffff 0, var(--bg) 42rem);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        max-width: 920px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 4px 14px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .status-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        min-width: 180px;
      }

      #status,
      #toolLine {
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 18px;
      }

      #toolLine {
        max-width: min(55vw, 420px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main {
        min-height: 0;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow);
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 100%;
        padding: 24px;
      }

      .empty {
        margin: auto;
        max-width: 460px;
        color: var(--muted);
        text-align: center;
        line-height: 1.45;
      }

      .message-row {
        display: flex;
        width: 100%;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(74%, 680px);
        border-radius: 18px;
        padding: 12px 15px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .bubble.user {
        border-bottom-right-radius: 6px;
        background: var(--user);
        color: #ffffff;
      }

      .bubble.assistant {
        border: 1px solid var(--assistant-border);
        border-bottom-left-radius: 6px;
        background: var(--assistant);
        color: var(--text);
      }

      .bubble.assistant.streaming::after {
        content: "";
        display: inline-block;
        width: 7px;
        height: 1.05em;
        margin-left: 3px;
        transform: translateY(2px);
        border-radius: 999px;
        background: #9ca3af;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        padding-top: 16px;
      }

      textarea {
        width: 100%;
        max-height: 180px;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 13px 15px;
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
        font: inherit;
        line-height: 1.35;
        outline: none;
      }

      textarea:focus {
        border-color: #9db7ff;
        box-shadow: 0 0 0 3px rgba(47, 111, 235, 0.13);
      }

      button {
        align-self: end;
        min-width: 84px;
        height: 46px;
        border: 0;
        border-radius: 999px;
        padding: 0 18px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      #sendButton {
        background: #111827;
        color: #ffffff;
      }

      #stopButton {
        display: none;
        border: 1px solid #fecaca;
        background: #fff1f2;
        color: #be123c;
      }

      #stopButton.visible {
        display: inline-block;
      }

      @media (max-width: 720px) {
        .app {
          padding: 12px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .status-wrap {
          align-items: flex-start;
        }

        #messages {
          padding: 16px;
        }

        .bubble {
          max-width: 88%;
        }

        form {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>OMP Webchat</h1>
        <div class="status-wrap" aria-live="polite">
          <div id="status">connecting…</div>
          <div id="toolLine"></div>
        </div>
      </header>

      <main id="scrollPane">
        <div id="messages">
          <div id="emptyState" class="empty">
            Ask the live OMP coding-agent session a question. Replies stream here as visible text deltas arrive.
          </div>
        </div>
      </main>

      <form id="composer">
        <textarea id="prompt" rows="2" placeholder="Message OMP…" autocomplete="off"></textarea>
        <button id="sendButton" type="submit" disabled>Send</button>
        <button id="stopButton" type="button">Stop</button>
      </form>
    </div>

    <script>
      const scrollPane = document.querySelector("#scrollPane");
      const messages = document.querySelector("#messages");
      const emptyState = document.querySelector("#emptyState");
      const statusLine = document.querySelector("#status");
      const toolLine = document.querySelector("#toolLine");
      const composer = document.querySelector("#composer");
      const promptInput = document.querySelector("#prompt");
      const sendButton = document.querySelector("#sendButton");
      const stopButton = document.querySelector("#stopButton");

      let streaming = false;
      let currentAssistantBubble = null;
      let currentAssistantText = null;

      function setStatus(text) {
        statusLine.textContent = text;
      }

      function setToolLine(text) {
        toolLine.textContent = text || "";
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          scrollPane.scrollTop = scrollPane.scrollHeight;
        });
      }

      function updateControls() {
        sendButton.disabled = streaming || promptInput.value.trim().length === 0;
        stopButton.disabled = !streaming;
        stopButton.classList.toggle("visible", streaming);
      }

      function setStreaming(value) {
        streaming = value;
        updateControls();
        if (!streaming) {
          if (currentAssistantBubble !== null) {
            currentAssistantBubble.classList.remove("streaming");
          }
          currentAssistantBubble = null;
          currentAssistantText = null;
          setToolLine("");
          promptInput.focus();
        }
      }

      function addBubble(role, text = "") {
        emptyState.remove();

        const row = document.createElement("div");
        row.className = `message-row ${role}`;

        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;

        const textNode = document.createElement("span");
        textNode.textContent = text;

        bubble.append(textNode);
        row.append(bubble);
        messages.append(row);
        scrollToBottom();

        return { bubble, textNode };
      }

      function ensureAssistantBubble() {
        if (currentAssistantBubble !== null && currentAssistantText !== null) {
          return;
        }

        const assistant = addBubble("assistant");
        currentAssistantBubble = assistant.bubble;
        currentAssistantText = assistant.textNode;
        currentAssistantBubble.classList.add("streaming");
      }

      function appendAssistantText(delta) {
        ensureAssistantBubble();
        currentAssistantText.append(document.createTextNode(delta));
        scrollToBottom();
      }

      function toolNameFromFrame(frame) {
        return (
          frame.toolName ||
          frame.tool_name ||
          frame.name ||
          frame.tool?.name ||
          frame.execution?.toolName ||
          frame.execution?.name ||
          "tool"
        );
      }

      function handleFrame(frame) {
        if (frame.type === "ready") {
          setStatus(streaming ? "working…" : "ready");
          return;
        }

        if (frame.type === "agent_start") {
          ensureAssistantBubble();
          setStreaming(true);
          setStatus("thinking…");
          return;
        }

        if (frame.type === "message_start") {
          if (streaming) {
            ensureAssistantBubble();
          }
          return;
        }

        if (frame.type === "message_update") {
          const event = frame.assistantMessageEvent;
          if (event?.type === "text_delta" && typeof event.delta === "string") {
            if (!streaming) {
              setStreaming(true);
            }
            appendAssistantText(event.delta);
            setStatus("responding…");
            return;
          }

          if (event?.type === "thinking_delta") {
            if (!streaming) {
              setStreaming(true);
            }
            setStatus("thinking…");
            return;
          }

          if (event?.type === "toolcall_delta") {
            if (!streaming) {
              setStreaming(true);
            }
            setStatus("working…");
          }
          return;
        }

        if (frame.type === "tool_execution_start") {
          setStatus("working…");
          setToolLine(`tool: ${toolNameFromFrame(frame)}`);
          return;
        }

        if (frame.type === "tool_execution_end") {
          setStatus("thinking…");
          setToolLine("");
          return;
        }

        if (frame.type === "agent_end") {
          setStreaming(false);
          setStatus("ready");
        }
      }

      const events = new EventSource("/events");
      events.onopen = () => {
        setStatus(streaming ? "working…" : "connected");
      };
      events.onmessage = (message) => {
        try {
          handleFrame(JSON.parse(message.data));
        } catch (error) {
          console.error("Bad SSE frame", error, message.data);
        }
      };
      events.onerror = () => {
        setStatus("connection lost; reconnecting…");
      };

      async function postJson(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });

        if (!response.ok) {
          let detail = response.statusText;
          try {
            const payload = await response.json();
            detail = payload.error || detail;
          } catch {
            // Keep the HTTP status text.
          }
          throw new Error(detail);
        }
      }

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = promptInput.value;
        if (streaming || message.trim().length === 0) {
          return;
        }

        addBubble("user", message);
        promptInput.value = "";
        setStreaming(true);
        setStatus("sending…");

        try {
          await postJson("/prompt", { message });
          setStatus("thinking…");
        } catch (error) {
          setStreaming(false);
          setStatus(`send failed: ${error.message}`);
        }
      });

      promptInput.addEventListener("input", updateControls);
      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (!sendButton.disabled) {
            composer.requestSubmit();
          }
        }
      });

      stopButton.addEventListener("click", async () => {
        if (!streaming) {
          return;
        }

        stopButton.disabled = true;
        setStatus("stopping…");
        try {
          await postJson("/abort", {});
        } catch (error) {
          setStatus(`stop failed: ${error.message}`);
          updateControls();
        }
      });

      updateControls();
    </script>
  </body>
</html>
