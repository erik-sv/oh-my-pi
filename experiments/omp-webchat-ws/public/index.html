<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMP Web Chat</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #1f2328;
        --muted: #70757d;
        --border: #dedbd2;
        --user: #2563eb;
        --user-text: #ffffff;
        --assistant: #ffffff;
        --shadow: 0 18px 50px rgba(31, 35, 40, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #ffffff 0, var(--bg) 45rem);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        max-width: 920px;
        margin: 0 auto;
        padding: 0 18px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 2px 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 680;
        letter-spacing: -0.01em;
      }

      .connection {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .messages {
        overflow-y: auto;
        padding: 18px 2px 26px;
        scroll-behavior: smooth;
      }

      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        min-height: 280px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--text);
        font-size: 24px;
        letter-spacing: -0.03em;
      }

      .row {
        display: flex;
        margin: 14px 0;
      }

      .row.user {
        justify-content: flex-end;
      }

      .row.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(76%, 680px);
        padding: 12px 14px;
        border-radius: 18px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user .bubble {
        border-bottom-right-radius: 6px;
        background: var(--user);
        color: var(--user-text);
      }

      .assistant .bubble {
        border: 1px solid var(--border);
        border-bottom-left-radius: 6px;
        background: var(--assistant);
        box-shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
      }

      .assistant .bubble:empty::before {
        content: "Thinking…";
        color: var(--muted);
      }

      .composer {
        padding: 12px 0 18px;
      }

      .status-line {
        min-height: 22px;
        padding: 0 4px 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .input-shell {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: end;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      textarea {
        min-height: 48px;
        max-height: 180px;
        resize: none;
        border: 0;
        outline: 0;
        padding: 12px 10px;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      button {
        min-width: 72px;
        height: 42px;
        border: 0;
        border-radius: 999px;
        padding: 0 16px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      #sendButton {
        background: var(--text);
        color: white;
      }

      #stopButton {
        border: 1px solid #efb3b3;
        background: #fff5f5;
        color: #b42318;
      }

      @media (max-width: 640px) {
        .app {
          padding: 0 10px;
        }

        .bubble {
          max-width: 88%;
        }

        .input-shell {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>OMP Web Chat</h1>
        <div class="connection" id="connection">connecting…</div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="emptyState">
          <div>
            <strong>Ask the live coding agent.</strong>
            <span>One shared OMP RPC session is connected through this browser.</span>
          </div>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="status-line" id="statusLine">Connecting to OMP…</div>
        <div class="input-shell">
          <textarea id="promptInput" rows="1" placeholder="Message OMP…" autocomplete="off"></textarea>
          <button id="sendButton" type="submit" disabled>Send</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>
      </form>
    </main>

    <script>
      const messages = document.getElementById("messages");
      const emptyState = document.getElementById("emptyState");
      const connection = document.getElementById("connection");
      const statusLine = document.getElementById("statusLine");
      const composer = document.getElementById("composer");
      const promptInput = document.getElementById("promptInput");
      const sendButton = document.getElementById("sendButton");
      const stopButton = document.getElementById("stopButton");

      let socket;
      let reconnectTimer;
      let reconnectAttempt = 0;
      let connected = false;
      let streaming = false;
      let currentAssistantBubble;
      let currentAssistantText;

      connect();

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        sendPrompt();
      });

      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendPrompt();
        }
      });

      promptInput.addEventListener("input", () => {
        promptInput.style.height = "auto";
        promptInput.style.height = `${Math.min(promptInput.scrollHeight, 180)}px`;
        updateControls();
      });

      stopButton.addEventListener("click", () => {
        if (!streaming) {
          return;
        }
        sendCommand({ type: "abort" });
        setStatus("stopping…");
      });

      function connect() {
        clearTimeout(reconnectTimer);
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        socket = new WebSocket(`${scheme}://${window.location.host}/ws`);
        setConnection("connecting…");

        socket.addEventListener("open", () => {
          connected = true;
          reconnectAttempt = 0;
          setConnection("connected");
          setStatus(streaming ? "working…" : "ready");
          updateControls();
        });

        socket.addEventListener("message", (event) => {
          let frame;
          try {
            frame = JSON.parse(event.data);
          } catch {
            return;
          }
          handleFrame(frame);
        });

        socket.addEventListener("close", () => {
          connected = false;
          setConnection("disconnected");
          updateControls();
          scheduleReconnect();
        });

        socket.addEventListener("error", () => {
          setConnection("connection error");
        });
      }

      function scheduleReconnect() {
        clearTimeout(reconnectTimer);
        const delay = Math.min(500 * 2 ** reconnectAttempt, 5000);
        reconnectAttempt += 1;
        reconnectTimer = setTimeout(connect, delay);
        setStatus(`reconnecting in ${Math.round(delay / 100) / 10}s…`);
      }

      function handleFrame(frame) {
        if (frame.type === "heartbeat") {
          return;
        }

        if (frame.type === "server_ready") {
          streaming = Boolean(frame.isStreaming);
          setStatus(streaming ? "working…" : "ready");
          updateControls();
          return;
        }

        if (frame.type === "server_status") {
          if (frame.status === "omp_ready") {
            setStatus(streaming ? "working…" : "ready");
          } else if (frame.status === "omp_exit") {
            streaming = false;
            setStatus("OMP session exited");
          }
          updateControls();
          return;
        }

        if (frame.type === "server_error") {
          setStatus(frame.message || "server error");
          return;
        }

        if (frame.type === "agent_start") {
          streaming = true;
          beginAssistantBubble();
          setStatus("thinking…");
          updateControls();
          return;
        }

        if (frame.type === "turn_start") {
          setStatus("thinking…");
          return;
        }

        if (frame.type === "message_start") {
          beginAssistantBubble();
          setStatus("responding…");
          return;
        }

        if (frame.type === "message_update") {
          handleMessageUpdate(frame.assistantMessageEvent || {});
          return;
        }

        if (frame.type === "tool_execution_start") {
          const label = frame.name || frame.toolName || frame.tool || "tool";
          setStatus(`working… ${label}`);
          return;
        }

        if (frame.type === "tool_execution_update") {
          setStatus("working…");
          return;
        }

        if (frame.type === "tool_execution_end") {
          setStatus(streaming ? "responding…" : "ready");
          return;
        }

        if (frame.type === "agent_end") {
          streaming = false;
          currentAssistantBubble = undefined;
          currentAssistantText = undefined;
          setStatus("ready");
          updateControls();
        }
      }

      function handleMessageUpdate(event) {
        if (event.type === "text_delta") {
          beginAssistantBubble();
          currentAssistantText.appendData(event.delta || "");
          setStatus("responding…");
          scrollToBottom();
          return;
        }

        if (event.type === "thinking_delta" || event.type === "thinking_start") {
          setStatus("thinking…");
          return;
        }

        if (event.type === "toolcall_delta" || event.type === "toolcall_start") {
          setStatus("working…");
        }
      }

      function sendPrompt() {
        const message = promptInput.value.trim();
        if (!message || streaming || !connected) {
          updateControls();
          return;
        }

        appendBubble("user", message);
        promptInput.value = "";
        promptInput.style.height = "auto";
        sendCommand({ type: "prompt", message });
        setStatus("queued…");
        updateControls();
      }

      function sendCommand(command) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          setStatus("not connected");
          return false;
        }
        socket.send(JSON.stringify(command));
        return true;
      }

      function beginAssistantBubble() {
        if (currentAssistantBubble) {
          return;
        }

        const bubble = appendBubble("assistant", "");
        currentAssistantBubble = bubble;
        currentAssistantText = document.createTextNode("");
        bubble.appendChild(currentAssistantText);
      }

      function appendBubble(role, text) {
        emptyState.hidden = true;
        const row = document.createElement("div");
        row.className = `row ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollToBottom();
        return bubble;
      }

      function setConnection(text) {
        connection.textContent = text;
      }

      function setStatus(text) {
        statusLine.textContent = text;
      }

      function updateControls() {
        sendButton.disabled = !connected || streaming || !promptInput.value.trim();
        stopButton.disabled = !connected || !streaming;
      }

      function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
      }
    </script>
  </body>
</html>
